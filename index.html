<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RMB Vellore Elite</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
        }
        .container {
            text-align: center;
            padding: 2rem;
            max-width: 800px;
        }
        h1 {
            font-size: 3.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #e94560, #f39422);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .tagline {
            font-size: 1.5rem;
            color: #a0a0a0;
            margin-bottom: 2rem;
        }
        .coming-soon {
            display: inline-block;
            padding: 1rem 2rem;
            border: 2px solid #e94560;
            border-radius: 50px;
            font-size: 1.2rem;
            color: #e94560;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }
        .contact {
            margin-top: 3rem;
            color: #888;
        }
        .contact a {
            color: #e94560;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>RMB Vellore Elite</h1>
        <p class="tagline">Excellence in Every Detail</p>
        <div class="coming-soon">Coming Soon</div>
        <div class="contact">
            <p>Contact us: <a href="mailto:info@rmbvelloreelite.com">info@rmbvelloreelite.com</a></p>
        </div>
    </div>
</body>
</html>
